[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavediff"
version = "0.1.0"
description = "Find the first moment two simulation waveforms disagree."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["vcd", "waveform", "verilog", "systemverilog", "eda", "verification", "simulation", "diff"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
wavediff = "wavediff.cli:main"

[project.urls]
Homepage = "https://github.com/Sonnet-dawn/wavediff"
Documentation = "https://sonnet-dawn.github.io/wavediff/"
Repository = "https://github.com/Sonnet-dawn/wavediff"
Issues = "https://github.com/Sonnet-dawn/wavediff/issues"
Changelog = "https://github.com/Sonnet-dawn/wavediff/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wavediff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
