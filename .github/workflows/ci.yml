name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is stdlib-only on purpose: no install step, no network.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t tests -v
        env:
          PYTHONPATH: src

  dogfood:
    name: wavediff detects a real regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install .

      - name: A waveform matches itself
        run: wavediff tests/fixtures/golden.vcd tests/fixtures/golden.vcd

      - name: A shifted waveform is realigned and passes
        run: wavediff tests/fixtures/golden.vcd tests/fixtures/shifted.vcd --align auto

      - name: A real regression must fail the build
        run: |
          set +e
          wavediff tests/fixtures/golden.vcd tests/fixtures/diverged.vcd --html diff.html
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 for a diverging pair, got $code"
            exit 1
          fi
          grep -q "00000111" diff.html
          echo "regression correctly detected and reported"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavediff-report
          path: diff.html
          if-no-files-found: ignore
